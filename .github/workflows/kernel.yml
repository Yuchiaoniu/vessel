name: Meta-Evolution-Kernel
on:
  discussion:
    types: [created, edited]
  discussion_comment:
    types: [created, edited]

concurrency:
  group: ${{ github.event.discussion.node_id || github.event.discussion_comment.discussion.node_id }}
  cancel-in-progress: true 

permissions:
  contents: write
  discussions: write
  issues: write
  pull-requests: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    # 【修正後的邏輯】：
    # 只要不是機器人發的，且內容包含 "/"，就必須啟動。
    if: |
      github.actor != 'github-actions[bot]' && 
      github.actor != 'Vessel-Agent' &&
      (contains(github.event.comment.body, '/') || contains(github.event.discussion.body, '/'))
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_PAT }}

      - name: Gemini Thinking & Execution
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.MY_PAT }}
          GH_TOKEN: ${{ secrets.MY_PAT }}
          D_NODE_ID: ${{ github.event.discussion.node_id || github.event.discussion_comment.discussion.node_id }}
          EVENT_BODY: ${{ github.event.comment.body || github.event.discussion.body || github.event.discussion_comment.body }}
        run: |
          cat << 'EOF' > think.py
          import os, json, requests, re

          api_key = os.environ.get("GEMINI_API_KEY")
          event_body = os.environ.get("EVENT_BODY", "")
          
          found_model = None
          for v in ["v1beta", "v1"]:
              try:
                  resp = requests.get(f"https://generativelanguage.googleapis.com/{v}/models?key={api_key}").json()
                  if 'models' in resp:
                      for m in resp['models']:
                          if 'generateContent' in m.get('supportedGenerationMethods', []):
                              found_model = (v, m['name']); break
                  if found_model: break
              except: continue

          if not found_model:
              print("Error: No Model Found")
              exit(1)

          url = f"https://generativelanguage.googleapis.com/{found_model[0]}/{found_model[1]}:generateContent?key={api_key}"
          prompt = f"指令：{event_body}\n規則：你是 Linux 專家。只輸出 Bash 代碼，禁止廢話。必須包含 git add, commit, push 指令來更新 README.md。"
          
          try:
              response = requests.post(url, json={"contents": [{"parts": [{"text": prompt}]}]})
              data = response.json()
              raw_text = data['candidates'][0]['content']['parts'][0]['text']
              clean_text = re.sub(r'```[a-zA-Z]*', '', raw_text).replace('```', '').strip()
              
              # 這裡採用更寬鬆的保留策略，確保指令不被誤刪
              with open("exec.sh", "w") as f:
                  f.write(clean_text)
          except Exception as e:
              print(f"Thinking Error: {e}")
          EOF

          python3 think.py
          
          if [ -f exec.sh ] && [ -s exec.sh ]; then
            git config --global user.name "Vessel-Agent"
            git config --global user.email "agent@vessel.bot"
            export GH_TOKEN=${{ secrets.MY_PAT }}
            
            echo "--- 🧠 AI 生成的指令如下 ---"
            cat exec.sh
            echo "--------------------------"
            
            bash exec.sh || echo "⚠️ 執行過程中有指令出錯，請檢查上方的指令內容。"
            
            if [ ! -z "$D_NODE_ID" ]; then
              gh api graphql -f query='mutation($body: String!, $id: ID!) { addDiscussionComment(input: {body: $body, discussionId: $id}) { comment { id } } }' \
                -f body="✅ **執行完畢**。請檢查檔案是否更新。" -f id="$D_NODE_ID"
            fi
          fi
