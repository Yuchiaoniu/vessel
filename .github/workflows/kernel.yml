name: Meta-Evolution-Kernel
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]
  discussion:
    types: [created, edited]
  discussion_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  discussions: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Gemini Thinking & Execution
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # 同時獲取 Issue 或 Discussion 的內容
          EVENT_BODY: ${{ github.event.issue.body || github.event.comment.body || github.event.discussion.body }}
        run: |
          run: |
          cat << 'EOF' > think.py
          import os, json, requests

          api_key = os.environ["GEMINI_API_KEY"]
          event_body = os.environ["EVENT_BODY"]
          
          found_model = None
          for v in ["v1beta", "v1"]:
              resp = requests.get(f"https://generativelanguage.googleapis.com/{v}/models?key={api_key}").json()
              if 'models' in resp:
                  for m in resp['models']:
                      if 'generateContent' in m.get('supportedGenerationMethods', []):
                          found_model = (v, m['name'])
                          if 'flash' in m['name'].lower(): break
              if found_model: break

          if not found_model: exit(1)

          version, model_path = found_model
          url = f"https://generativelanguage.googleapis.com/{version}/{model_path}:generateContent?key={api_key}"
          prompt = f"你是一個 GitHub Agent。指令：{event_body}\n請輸出 bash 指令。若要同步狀態請用 'gh variable set 名稱 --body 內容'。只輸出代碼。"
          
          response = requests.post(url, json={"contents": [{"parts": [{"text": prompt}]}]})
          data = response.json()

          if 'candidates' in data:
              text = data['candidates'][0]['content']['parts'][0]['text']
              with open("exec.sh", "w") as f:
                  f.write(text.replace('```bash', '').replace('```sh', '').replace('```', '').strip())
          EOF

          python3 think.py
          
          if [ -f exec.sh ]; then
            git config --global user.name "Vessel-Agent"
            git config --global user.email "agent@vessel.bot"
            
            # --- 關鍵修正：移除 gh auth login，直接賦予變數並執行 ---
            export GH_TOKEN=${{ secrets.GITHUB_TOKEN }}
            echo "--- 正在執行 AI 生成的指令 ---"
            bash exec.sh
            
            # 回報進度
            if [ "${{ github.event_name }}" == "issue_comment" ] || [ "${{ github.event_name }}" == "issues" ]; then
              gh issue comment ${{ github.event.issue.number }} --body "✅ 系統已進化。權限與變數同步邏輯已修正。"
            elif [ "${{ github.event_name }}" == "discussion_comment" ] || [ "${{ github.event_name }}" == "discussion" ]; then
              gh discussion comment ${{ github.event.discussion.number }} --body "✅ 收到神諭，Discussions 通訊渠道已完全激活。"
            fi
          fi
