name: Meta-Evolution-Kernel
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Gemini Thinking & Execution
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body || github.event.comment.body }}
        run: |
          # 1. 建立一個乾淨的指令提取 Python 腳本 (直接處理 JSON)
          cat << 'EOF' > think.py
          import os
          import json
          import requests

          api_key = os.environ["GEMINI_API_KEY"]
          issue_body = os.environ["ISSUE_BODY"]
          
          url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key={api_key}"
          
          prompt = f"""
          你是一個 GitHub 自動化 Agent。
          當前目標：{issue_body}
          
          請寫出達成目標所需的 bash 指令（例如 cat、git add、git commit）。
          
          規則：
          1. 只輸出代碼，不要解釋。
          2. 必須包含 git 配置和提交指令：
             git config --global user.name "Vessel-Agent"
             git config --global user.email "agent@vessel.bot"
             git add .
             git commit -m "AI: 執行進化指令" || echo "無變動"
             git push
          """
          
          payload = {
              "contents": [{
                  "parts": [{"text": prompt}]
              }]
          }
          
          response = requests.post(url, json=payload)
          data = response.json()
          
          # 提取回傳的文字並清理格式
          try:
              raw_text = data['candidates'][0]['content']['parts'][0]['text']
              clean_text = raw_text.replace('```bash', '').replace('```', '').strip()
              with open("exec.sh", "w") as f:
                  f.write(clean_text)
          except Exception as e:
              print(f"解析失敗: {data}")
              raise e
          EOF

          # 2. 執行 Python 腳本來請求 Gemini
          python3 think.py

          # 3. 執行 Gemini 生成的指令
          if [ -f exec.sh ]; then
            echo "--- 執行生成的指令 ---"
            cat exec.sh
            bash exec.sh
          else
            echo "未能生成 exec.sh"
            exit 1
          fi
