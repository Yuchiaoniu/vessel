name: Meta-Evolution-Kernel
on:
  discussion:
    types: [created]
  discussion_comment:
    types: [created]

# 改為 true：如果新的進來了，直接殺掉舊的，不准排隊
concurrency:
  group: ${{ github.event.discussion.node_id || github.event.discussion_comment.discussion.node_id }}
  cancel-in-progress: true 

permissions:
  contents: write
  discussions: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    # 【核心鎖定】：只有「非機器人」且留言內容包含「/」符號時才啟動
    if: |
      github.actor != 'github-actions[bot]' && 
      github.actor != 'Vessel-Agent' &&
      (startsWith(github.event.comment.body, '/') || startsWith(github.event.discussion.body, '/'))
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.MY_PAT }}
      
      # ... 後續步驟保持不變 ...
