name: Meta-Evolution-Kernel
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Gemini Thinking & Execution
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body || github.event.comment.body }}
        run: |
          cat << 'EOF' > think.py
          import os
          import json
          import requests

          api_key = os.environ["GEMINI_API_KEY"]
          issue_body = os.environ["ISSUE_BODY"]
          
          # 嘗試使用 v1 版本的 gemini-1.5-flash，這是目前最穩定的路徑
          url = f"https://generativelanguage.googleapis.com/v1/models/gemini-1.5-flash:generateContent?key={api_key}"
          
          prompt = f"""
          你是一個 GitHub Agent。主人指令：{issue_body}
          請寫出 bash 指令來達成目標。
          必須包含 git config, git add, git commit, git push。
          只輸出代碼，不要解釋。
          """
          
          payload = {
              "contents": [{
                  "parts": [{"text": prompt}]
              }]
          }
          
          response = requests.post(url, json=payload)
          data = response.json()
          
          if 'error' in data:
              # 如果 flash 失敗，自動降級嘗試 pro 版本
              print(f"Flash 嘗試失敗，更換路徑中...")
              url = f"https://generativelanguage.googleapis.com/v1/models/gemini-pro:generateContent?key={api_key}"
              response = requests.post(url, json=payload)
              data = response.json()

          try:
              raw_text = data['candidates'][0]['content']['parts'][0]['text']
              # 清理 Markdown 代碼塊
              clean_text = raw_text.replace('```bash', '').replace('```sh', '').replace('```', '').strip()
              with open("exec.sh", "w") as f:
                  f.write(clean_text)
          except Exception as e:
              print(f"API 回傳內容: {json.dumps(data, indent=2)}")
              raise e
          EOF

          python3 think.py

          if [ -f exec.sh ]; then
            # 防止 Gemini 生成危險指令或空指令，先檢查內容
            echo "--- Gemini 生成的指令內容 ---"
            cat exec.sh
            
            # 設定 Git 身份，避免執行時出錯
            git config --global user.name "Vessel-Agent"
            git config --global user.email "agent@vessel.bot"
            
            # 執行指令
            bash exec.sh
          else
            echo "Failed to create exec.sh"
            exit 1
          fi
