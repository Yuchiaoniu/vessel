name: Meta-Evolution-Kernel
on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

jobs:
  evolve:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Gemini Thinking & Execution
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_BODY: ${{ github.event.issue.body || github.event.comment.body }}
        run: |
          cat << 'EOF' > think.py
          import os
          import json
          import requests

          api_key = os.environ["GEMINI_API_KEY"]
          issue_body = os.environ["ISSUE_BODY"]

          # 先列出所有可用模型，這能確保我們不會再抓到 404
          list_url = f"https://generativelanguage.googleapis.com/v1beta/models?key={api_key}"
          l_resp = requests.get(list_url).json()
          
          # 尋找包含 'gemini-1.5-flash' 字樣的模型 ID
          model_name = "models/gemini-1.5-flash" # 預設值
          if 'models' in l_resp:
              for m in l_resp['models']:
                  if 'gemini-1.5-flash' in m['name']:
                      model_name = m['name']
                      break
          
          print(f"確定的模型路徑: {model_name}")

          url = f"https://generativelanguage.googleapis.com/v1beta/{model_name}:generateContent?key={api_key}"
          
          prompt = f"你是一個 GitHub Agent。主人指令：{issue_body}\n請輸出達成目標的 bash 指令（包含 git config/add/commit/push），只輸出代碼，不要解釋。"
          
          payload = {"contents": [{"parts": [{"text": prompt}]}]}
          response = requests.post(url, json=payload)
          data = response.json()

          if 'candidates' in data:
              text = data['candidates'][0]['content']['parts'][0]['text']
              with open("exec.sh", "w") as f:
                  f.write(text.replace('```bash', '').replace('```sh', '').replace('```', '').strip())
          else:
              print(f"API 回傳異常：{json.dumps(data, indent=2)}")
          EOF

          python3 think.py
          
          if [ -f exec.sh ]; then
            git config --global user.name "Vessel-Agent"
            git config --global user.email "agent@vessel.bot"
            # 確保內容不是空的才執行
            if [ -s exec.sh ]; then
              bash exec.sh
            fi
          fi
